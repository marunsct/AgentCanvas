name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same branch or PR replaces the run in progress
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: agentcanvas, POSTGRES_PASSWORD: agentcanvas, POSTGRES_DB: agentcanvas }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U agentcanvas" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run python scripts/export_ir_schema.py && git diff --exit-code ../../packages/ir-schema agentcanvas/copilot/knowledge/user-guide
      - run: make -C ../.. crewai  # S27: CrewAI flows run in the conformance kit and their own tests
      - run: make -C ../.. framework FW=google_adk  # S29: so do Google ADK workflows
      - run: make -C ../.. framework FW=pydantic_ai && make -C ../.. framework FW=agno  # S32: and Pydantic AI, Agno
      - run: make -C ../.. framework FW=microsoft_agent_framework  # S33–S34: and the Microsoft Agent Framework
      - run: make -C ../.. framework FW=strands && make -C ../.. framework FW=llamaindex  # S35: Strands, LlamaIndex
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: make -C ../.. mastra  # S36: Mastra workflows run on Node.js
      - run: uv run pytest -q
        env:
          AGENTCANVAS_ENV: test
          TEST_DATABASE_URL: "postgresql://agentcanvas:agentcanvas@localhost:5432/agentcanvas"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --with mkdocs-material mkdocs build --strict -d site

  connectors:  # S15: every gallery connector's package exists at its pinned version; keyless local ones start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: uv sync --frozen
      - run: uv run python scripts/smoke_mcp_gallery.py
      - run: uv run python scripts/check_part_envs.py  # S28: which frameworks a mixed-flow export installs apart

  frameworks:  # S16/S21: real agents from each framework, wrapped and drawn on the canvas, against fake models
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:  # versions match interop.FRAMEWORKS and designs.AGENT_FRAMEWORKS (what exports install)
          - { check: openai_agents, with: "openai-agents==0.23.1" }
          - { check: crewai, with: "crewai==1.15.25" }
          - { check: google_adk, with: "google-adk==2.11.0 litellm==1.104.2" }
          - { check: pydantic_ai, with: "pydantic-ai-slim[openai]==2.54.0" }
          - { check: agno, with: "agno==3.1.1 openai==2.54.0" }
          - { check: strands, with: "strands-agents[openai]==1.58.1" }
          - { check: llamaindex, with: "llama-index-workflows==2.25.0 llama-index-core==0.14.25 llama-index-llms-openai-like==0.8.1" }
          - { check: microsoft_agent_framework, with: "agent-framework-core==1.20.0 agent-framework-openai==1.16.0" }
          - { check: claude_agent_sdk, with: "claude-agent-sdk==0.2.164" }
          - { check: agentspec, with: "pyagentspec==26.3.1" }
          # S22: whole workflows through Agent Spec (preview); versions match bridges.TARGETS
          - { check: bridge_langgraph, with: "pyagentspec[langgraph]==26.3.1 jinja2" }
          - { check: bridge_wayflow, with: "wayflowcore==26.3.1 jinja2" }
          - { check: bridge_openai_agents, with: "pyagentspec==26.3.1 openai-agents==0.23.1" }
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run $(printf -- '--with %s ' ${{ matrix.with }}) python scripts/smoke_frameworks.py ${{ matrix.check }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen && git diff --exit-code src/ir/generated.ts src/api/generated.ts src/help/diagnostics.generated.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    # M8-T6: known vulnerabilities in the locked production dependencies (dev tools never ship)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Python (pip-audit)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: JavaScript (pnpm audit)
        working-directory: apps/web
        run: pnpm audit --prod --audit-level high

  images:
    # M8-T1/T2: build both images, start the production compose stack and check it answers; render the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_IMAGE: agentcanvas-api:ci
      WEB_IMAGE: agentcanvas-web:ci
      POSTGRES_PASSWORD: ci-only
      POSTGRES_APP_PASSWORD: ci-only-app
      LANGGRAPH_AES_KEY: ci-only-aes-key-0123456789abcdef
      AGENTCANVAS_SECRET_KEY: ci-only-secret-key-not-for-real-use-0123456789abcdef0123456789abcdef
      AGENTCANVAS_OIDC_ISSUER: https://login.example.com/realms/ci
      AGENTCANVAS_OIDC_AUDIENCE: agentcanvas-api
      AGENTCANVAS_OIDC_CLIENT_ID: agentcanvas-web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: infra/Dockerfile.api
          load: true
          tags: agentcanvas-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.web
          load: true
          tags: agentcanvas-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan the images (Trivy)
        # high and critical OS and library vulnerabilities that have a fix; accepted ones go in infra/.trivyignore
        # with a reason. The scanner runs from an image pinned by digest, not a mutable action tag.
        env:
          TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
        run: |
          for image in agentcanvas-api:ci agentcanvas-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/infra/.trivyignore:/.trivyignore:ro" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /.trivyignore --exit-code 1 "$image"
          done
      - name: Start the production compose stack
        run: docker compose -f infra/compose.prod.yml up -d --wait --wait-timeout 180
      - name: Check it answers through nginx
        run: |
          set -eux
          curl -fsS http://localhost:8080/api/readyz | grep -q ready
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html>"
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080$asset" | grep -qi "immutable"
          curl -fsSI http://localhost:8080/ | grep -i "content-security-policy" | grep -q "connect-src 'self' https://login.example.com;"
          curl -fsSI http://localhost:8080/ | grep -qi "frame-ancestors 'self'"
          # S23: a share link's chat page is framed only by the sites its builder allows (the chat widget; any site
          # until some are listed): the API answers per link, and a link that does not exist allows only the app
          curl -fsSI http://localhost:8080/s/sh_ci | grep -i "content-security-policy" | grep -qi "frame-ancestors 'self';"
          test -z "$(curl -fsSI http://localhost:8080/s/sh_ci | grep -i x-frame-options)"
          curl -fsS http://localhost:8080/s/sh_ci | grep -qi "<!doctype html>"
          curl -fsSI http://localhost:8080/widget.js | grep -qi "content-type: application/javascript"
          curl -fsS http://localhost:8080/api/v1/auth/config | grep -q '"mode":"oidc"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/projects)" = 401
          docker compose -f infra/compose.prod.yml exec -T api id -u | grep -qx 10001
          # the API's database role is an ordinary one, so row-level security applies to it
          docker compose -f infra/compose.prod.yml exec -T postgres psql -U agentcanvas -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'agentcanvas_app'" | grep -qx f
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics)" = 404
          docker compose -f infra/compose.prod.yml exec -T api python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/metrics').read().decode())" | grep -q agentcanvas_runs_active
      - name: Logs
        if: failure()
        run: docker compose -f infra/compose.prod.yml logs --no-color
      - name: Start the local compose stack (same images, no sign-in, first-run setup)
        env: { API_IMAGE: "agentcanvas-api:ci", WEB_IMAGE: "agentcanvas-web:ci" }
        run: |
          set -eux
          docker compose -f infra/compose.prod.yml down
          docker compose -f infra/compose.local.yml up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost:7777/api/v1/auth/config | grep -q '"mode":"dev"'
          curl -fsS http://localhost:7777/api/v1/projects/prj_default/setup | grep -q '"done":false'
          curl -fsS http://localhost:7777/api/v1/model-providers | grep -q '"id":"ollama"'
          curl -fsS -X PUT -H 'content-type: application/json' -d '{"model": "ollama:llama3.3"}' \
            http://localhost:7777/api/v1/projects/prj_default/setup | grep -q '"done":true'
      - name: Local stack logs
        if: failure()
        run: docker compose -f infra/compose.local.yml logs --no-color
      - uses: azure/setup-helm@v5
      - name: Lint and render the Helm chart
        run: |
          helm lint infra/helm/agentcanvas -f infra/helm/agentcanvas/ci/test-values.yaml --strict
          helm template agentcanvas infra/helm/agentcanvas -f infra/helm/agentcanvas/ci/test-values.yaml > /dev/null

  export:
    # S16: every template exports to every target; the deploy files lint; each export passes its own tests with its
    # own pinned packages; one is deployed for real with Docker Compose and one on Kubernetes (kind), then checked
    # with make doctor and make smoke as the guides say. Cloud targets get a syntax check: CI holds no cloud accounts.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [api]
    env: { EXPORTS: "${{ github.workspace }}/exports" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7  # S36: Mastra exports are TypeScript projects
        with: { node-version: 22 }
      - uses: azure/setup-helm@v5
      - run: cd apps/api && uv sync --frozen && uv run python scripts/export_templates.py "$EXPORTS"
      - name: Lint the deploy files
        run: |
          for s in "$EXPORTS"/*/*/*/deploy/*/deploy.sh; do bash -n "$s"; done
          for c in "$EXPORTS"/kubernetes/*/*/deploy/kubernetes/chart; do
            helm lint "$c" --set image.repository=example/app
            helm template x "$c" --set image.repository=example/app --set ingress.enabled=true --set ingress.host=a.example.com >/dev/null
          done
          for d in "$EXPORTS"/local/*/* "$EXPORTS"/server/*/*; do
            touch "$d/.env"
            DOMAIN=a.example.com POSTGRES_PASSWORD=x docker compose -f "$d"/deploy/*/docker-compose.yml config -q
            rm "$d/.env"  # make setup creates the real one below
          done
          for t in "$EXPORTS"/aws/*/*/deploy/aws/task-definition.json; do python3 -m json.tool "$t" >/dev/null; done
      - name: Each export passes its own tests (uv sync with the exported pins)
        run: |
          for d in "$EXPORTS"/local/*/*; do (cd "$d" && make -s test) || exit 1; done  # S28: make install sets up parts
          for d in "$EXPORTS"/openai_agents/*/* "$EXPORTS"/crewai/*/* "$EXPORTS"/google_adk/*/* "$EXPORTS"/pydantic_ai/*/* "$EXPORTS"/agno/*/* "$EXPORTS"/microsoft_agent_framework/*/* "$EXPORTS"/strands/*/* "$EXPORTS"/llamaindex/*/*; do (cd "$d" && uv sync -q && uv run pytest -q) || exit 1; done
          for d in "$EXPORTS"/mastra/*/*; do (cd "$d" && npm install -s --no-audit --no-fund && npm test) || exit 1; done  # S36: TypeScript
      - name: Docker Compose, for real (support triage; DEMO_MODE, no model keys)
        working-directory: exports/local/ticket_triage/support-triage
        run: |
          make setup && sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/' .env
          make doctor
          make deploy
          make smoke
          docker compose --env-file .env -f deploy/local/docker-compose.yml down -v
      - name: Docker Compose, for real, a mixed flow (S28; OpenAI Agents SDK in the host, CrewAI as a part)
        working-directory: exports/local/mixed_team/mixed-framework-team
        run: |
          make setup && sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/' .env
          make doctor
          make deploy
          make smoke
          docker compose --env-file .env -f deploy/local/docker-compose.yml down -v
      - uses: helm/kind-action@v1
      - name: Kubernetes (kind), for real (classify and route)
        working-directory: exports/kubernetes/classify_and_route/classify-and-route
        run: |
          make setup && sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/; s/^IMAGE_REPOSITORY=/IMAGE_REPOSITORY=classify-and-route/; s/^K8S_NAMESPACE=/K8S_NAMESPACE=demo/' .env
          make doctor
          docker build -t classify-and-route:ci .
          kind load docker-image classify-and-route:ci --name chart-testing
          kubectl create namespace demo
          grep -E '^(API_KEYS|DEMO_MODE)=' .env > /tmp/svc.env
          kubectl -n demo create secret generic classify-and-route-env --from-env-file=/tmp/svc.env
          helm install classify-and-route deploy/kubernetes/chart -n demo --wait --timeout 5m \
            --set image.repository=classify-and-route --set image.tag=ci --set image.pullPolicy=Never
          kubectl -n demo port-forward svc/classify-and-route 8000:80 & sleep 3
          make smoke

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: cd apps/api && uv sync --frozen
      - run: make crewai  # S27: the CrewAI journey runs a CrewAI flow
      - run: make framework FW=google_adk  # S29: the Google ADK journey runs an ADK workflow
      - run: make framework FW=pydantic_ai && make framework FW=agno  # S32: the Pydantic AI and Agno journeys
      - run: make framework FW=microsoft_agent_framework  # S33–S34: the Microsoft Agent Framework journey
      - run: make framework FW=strands && make framework FW=llamaindex  # S35: the Strands and LlamaIndex journeys
      - run: make mastra  # S36: the Mastra journey runs a TypeScript flow on Node.js
      - run: cd apps/web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: cd apps/web && pnpm e2e
      - name: Print the page state of failed tests
        if: failure()
        run: for f in apps/web/test-results/*/error-context.md; do [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }; done; true
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
        env: { CI: "true" }
