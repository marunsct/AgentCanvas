name: copilot-evals
# The Copilot against a real model (product-plan-2026-10.md §2.5): build ten workflows from plain requests and fix about
# over a hundred planted bugs, on both engines, and fail below a pass rate. It needs a provider key in the repository's
# secrets (ANTHROPIC_API_KEY, or OPENAI_API_KEY with COPILOT_EVAL_MODEL set to an OpenAI model); without one the
# job says so and stops. The model is the repository variable COPILOT_EVAL_MODEL (default: a small Claude model, to
# keep a nightly run cheap). Results are kept as an artifact for 30 days.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model: { description: "provider:model (empty: COPILOT_EVAL_MODEL)", required: false }

permissions:
  contents: read

concurrency:
  group: copilot-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [loop, deepagents]
    defaults: { run: { working-directory: apps/api } }
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: ${{ inputs.model || vars.COPILOT_EVAL_MODEL || 'anthropic:claude-haiku-5-5' }}
    steps:
      - name: Is there a key?
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY$OPENAI_API_KEY" ]; then
            # the job ends green with every other step skipped; say so where people look, not only in the log
            echo "::notice title=Copilot evaluation skipped::No ANTHROPIC_API_KEY or OPENAI_API_KEY secret in this repository: nothing was evaluated."
            echo "### Copilot evaluation (${{ matrix.engine }}): skipped, no provider key in the repository's secrets" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: steps.key.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - if: steps.key.outputs.run == 'true'
        run: uv sync --frozen
      - name: Build ten workflows from requests
        if: steps.key.outputs.run == 'true'
        run: uv run python -m agentcanvas.copilot.evals --model "$MODEL" --engine ${{ matrix.engine }} --suite build --min-pass 0.7 --out build.json
      - name: Fix planted bugs
        if: steps.key.outputs.run == 'true' && always()
        run: uv run python -m agentcanvas.copilot.evals --model "$MODEL" --engine ${{ matrix.engine }} --suite debug --min-pass 0.7 --out debug.json
      - if: steps.key.outputs.run == 'true' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: copilot-evals-${{ matrix.engine }}
          path: apps/api/*.json
          retention-days: 30
