name: Feature request
description: Something AgentCanvas should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The job you want done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. A sketch or a link to another tool doing it is welcome.
  - type: input
    id: framework
    attributes:
      label: Framework, if it is about one
      placeholder: CrewAI
