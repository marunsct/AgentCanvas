[project]
name = "agentcanvas"
version = "0.32.3"
description = "AgentCanvas control plane and runner: visual agentic workflows compiled to LangGraph/LangChain/Deep Agents"
requires-python = ">=3.12,<3.15"
# Stack "stack-2026.09" (ADR 0017), verified together on 2026-09-29 (spec doc 14)
dependencies = [
  "langgraph>=1.2.20,<1.3",
  "langchain[mcp]>=1.4.9,<1.5",
  "langchain-core>=1.6.5,<2",
  "deepagents>=0.7.34,<0.8",
  "langsmith>=0.14.1,<0.15",
  "langgraph-checkpoint-postgres>=3.1",
  "psycopg[binary,pool]>=3.3.8",
  "fastapi>=0.162.2",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.3",
  "jinja2>=3.1",
  "cel-python>=0.4",
  "ruff>=0.17.4", # used at runtime by the code generator (ruff format)
  "sqlalchemy[asyncio]>=2.1.8",
  "alembic>=1.20.1",
  "aiosqlite>=0.22.1",
  "python-ulid>=4.1.0",
  "structlog>=24.4",
  "pydantic-settings>=2.16.2",
  "jsonschema>=4.23",
  "httpx>=0.27", # HTTP request tool (M3-T6)
  "cryptography>=50.0.2", # project secrets (M5-T6)
  "pyjwt[crypto]>=2.15.1", # OIDC bearer tokens (M7-T1)
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.45.1", # 1.45.0: CVE-2026-114603, a slow `tracestate` header parse before sign-in
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "pycryptodome>=4.4.0",
  "langchain-openai>=1.7.4",
  "langchain-google-genai>=4.0",
  "langchain-mistralai>=1.0",
  "langchain-groq>=1.0",
  "langchain-ollama>=1.0",
  "langchain-deepseek>=1.0",
  "langchain-xai>=1.0",
  "pypdf>=7.0.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.33",
  "openai-agents==0.24.0",  # S25: workflows designed for the OpenAI Agents SDK (pre-1.0: exact pin)
  "pypdfium2>=5.15.0",
  "pillow>=11",
  "ag-ui-protocol>=1.0,<2",
]

[project.optional-dependencies]
# cloud KMS clients for AGENTCANVAS_KMS_KEY=aws:/gcp: (the API image installs both; a source install adds
# the one it needs: uv sync --extra kms-aws)
kms-aws = ["boto3>=1.43.126"]
kms-gcp = ["google-cloud-kms>=3.2"]
# model providers in your own cloud account: AWS Bedrock (bedrock_converse:) and Claude on Google Vertex AI
# (google_anthropic_vertex:). The API image installs both; a source install adds the one it needs: uv sync --extra
# models-aws. Gemini on Vertex AI (google_vertexai:) needs neither: it uses langchain-google-genai
models-aws = ["langchain-aws>=1.9,<2"]
models-gcp = ["langchain-google-vertexai>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.27",
    "pyright>=1.1.390",
    "ruff>=0.17.4",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    # the cloud model providers (the models-aws and models-gcp extras), so their tests run
    "langchain-aws>=1.9,<2",
    "langchain-google-vertexai>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  "agentcanvas/copilot/knowledge/user-guide",  # copies of docs/user-guide, kept verbatim
  "agentcanvas/vendor",  # the Matura SDK, copied verbatim from its own repository
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE", "PLW"]

[tool.ruff.lint.per-file-ignores]
"agentcanvas/adapters/langchain/deploykit.py" = ["E501"]  # generated guides and shell scripts, kept readable as text

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["agentcanvas"]
# S27/S29/S32/S33: these run in the frameworks' own environments (make crewai, make framework FW=<id>), which the API's
# own does not install
exclude = [
  "agentcanvas/adapters/crewai/runtime.py", "agentcanvas/adapters/crewai/worker.py",
  "agentcanvas/adapters/google_adk/runtime.py", "agentcanvas/adapters/google_adk/worker.py",
  "agentcanvas/adapters/pydantic_ai/runtime.py", "agentcanvas/adapters/pydantic_ai/worker.py",
  "agentcanvas/adapters/agno/runtime.py", "agentcanvas/adapters/agno/worker.py",
  "agentcanvas/adapters/microsoft_agent_framework/runtime.py",
  "agentcanvas/adapters/microsoft_agent_framework/worker.py",
  "agentcanvas/adapters/strands/runtime.py", "agentcanvas/adapters/strands/worker.py",
  "agentcanvas/adapters/llamaindex/runtime.py", "agentcanvas/adapters/llamaindex/worker.py",
]
typeCheckingMode = "standard"

[tool.importlinter]
root_package = "agentcanvas"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core stays framework-neutral (ADR 0011): only agentcanvas.adapters may import LangChain/LangGraph"
type = "forbidden"
source_modules = [
  "agentcanvas.ir",
  "agentcanvas.validation",
  "agentcanvas.registry",
  "agentcanvas.db",
  "agentcanvas.services",
  "agentcanvas.runtime",
  "agentcanvas.security",
  "agentcanvas.api",
  "agentcanvas.settings",
  "agentcanvas.errors",
  "agentcanvas.copilot",
]
forbidden_modules = ["langchain", "langchain_core", "langgraph", "deepagents"]
allow_indirect_imports = true
