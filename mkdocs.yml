# Documentation site (M6-T8): `uvx --with mkdocs-material mkdocs serve` (or `make docs`)
# Two sets: the user guide (docs/user-guide) and the developer documentation (docs/developer, map in its README.md).
site_name: AgentCanvas
site_description: Visual agentic workflows compiled to LangGraph, the OpenAI Agents SDK, CrewAI, Google ADK, Pydantic AI, Agno, the Microsoft Agent Framework, Strands, LlamaIndex or Mastra
repo_url: https://github.com/marunsct/AgentCanvas
docs_dir: docs
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
markdown_extensions:
  [tables, admonition, toc, attr_list, pymdownx.superfences, pymdownx.details, {pymdownx.tabbed: {alternate_style: true}}]
not_in_nav: |
  /developer/spec/adapters/*
  /developer/build-guide/reference/**
validation:
  links:
    not_found: info
    anchors: info
  omitted_files: info
nav:
  - Home: index.md
  - User guide:
      - Overview: user-guide/index.md
      - Start here:
          - Run on your computer: user-guide/run-locally.md
          - Beginner's guide: user-guide/beginner-guide.md
