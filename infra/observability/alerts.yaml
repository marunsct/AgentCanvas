# Prometheus alerting rules for AgentCanvas (M8-T3). Load with `rule_files:` or a PrometheusRule resource.
groups:
  - name: agentcanvas
    rules:
      - alert: AgentCanvasHighErrorRate
        expr: |
          sum(rate(agentcanvas_http_requests_total{status=~"5.."}[10m]))
            / clamp_min(sum(rate(agentcanvas_http_requests_total[10m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: page }
        annotations:
          summary: More than 5 % of API requests fail with a server error
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasRunsFailing
        expr: |
          sum(increase(agentcanvas_runs_finished_total{status="error"}[30m]))
            / clamp_min(sum(increase(agentcanvas_runs_finished_total[30m])), 1) > 0.2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: More than 20 % of runs end in an error (check model providers and recent publishes)
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(agentcanvas_http_request_duration_seconds_bucket{route!~".*/stream|.*/events"}[10m]))) > 2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: API p95 latency (streams excluded) is above 2 s
      - alert: AgentCanvasApiDown
        # by a series only the API exports (an unlabelled gauge, there from start-up), not by the scrape job's name:
        # the usual kubernetes-pods job (prometheus.io/* annotations) is called "kubernetes-pods", which a job-name
        # match never found, so the alert fired forever. With several installs in one Prometheus, narrow it by the
        # labels your relabelling keeps, e.g. absent(agentcanvas_runs_active{namespace="agentcanvas"}) (with
        # `labelmap: __meta_kubernetes_pod_label_(.+)`, pod labels such as app_kubernetes_io_instance as well).
        expr: absent(agentcanvas_runs_active)
        for: 5m
        labels: { severity: page }
        annotations:
          summary: Prometheus has no metrics from any AgentCanvas API pod (all down, crash-looping, or not scraped)
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasEvaluationDrift
        # every API pod reports the open drift alerts from the database once a minute (S13 FR-EVAL-06)
        expr: max by (deployment, evaluator, kind) (agentcanvas_eval_alert_open) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Online evaluator {{ $labels.evaluator }} drifted ({{ $labels.kind }}) on deployment {{ $labels.deployment }}"
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasCostAlert
        # a workflow's spending reached a share of its day or month budget (S26); the app lists the alert too
        expr: sum by (period) (increase(agentcanvas_cost_alerts_total[15m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "A workflow reached a cost alert on its {{ $labels.period }} budget (see the workflow's Spending panel)"
      - alert: AgentCanvasModelFailover
        # backup models are answering: a model provider is failing (S26)
        expr: sum(rate(agentcanvas_model_fallbacks_total[10m])) > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Backup models are answering model calls; a model provider may be down
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasBackgroundJobFailing
        # hand-over, cron triggers, retention, crawls, experiments, secrets sync, online metrics, Matura feed: a round
        # that raised is only logged by the job, so the counter is what can page
        expr: sum by (job) (increase(agentcanvas_job_failures_total[15m])) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Background job {{ $labels.job }} keeps failing (search the logs for its *_failed event)"
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasBackgroundJobStale
        # no pod finished a round for many intervals (hung, or failing everywhere); retention and the Matura feed run
        # hourly, the others every minute or less (crawls: 5 min)
        expr: |
          (time() - max by (job) (agentcanvas_job_last_success_timestamp_seconds{job!~"retention|matura_feed"})) > 1800
            or (time() - max by (job) (agentcanvas_job_last_success_timestamp_seconds{job=~"retention|matura_feed"})) > 4 * 3600
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Background job {{ $labels.job }} has not finished a round on any pod for a long time"
      - alert: AgentCanvasApprovalNotificationsFailing
        # approval notifications given up after every retry: a mail server, a Slack webhook or an organisation's own
        # webhook that refuses them; the Inbox still has the items, but nobody is told
        expr: sum by (channel) (increase(agentcanvas_approval_notifications_total{outcome="failed"}[1h])) > 0
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: Approval notifications on {{ $labels.channel }} are failing after every retry
          runbook: docs/user-guide/operations.md#runbooks
      - alert: AgentCanvasRunQueueSlow
        # runs wait for a slot (AGENTCANVAS_MAX_CONCURRENT_RUNS or an organisation's own limit): too low a limit, a
        # busy project filling it, or runs that hold their slots too long
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(agentcanvas_run_queue_wait_seconds_bucket[15m]))) > 120
          or sum(increase(agentcanvas_run_queue_timeouts_total[15m])) > 0
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Runs wait more than 2 minutes for a slot in the run queue, or give up waiting
          runbook: docs/user-guide/operations.md#runbooks
