# The web image's nginx site (a template: ${API_UPSTREAM} is filled in at start-up).
# Serves the SPA and proxies /api/ to the API, unbuffered so Server-Sent Events stream in real time.
# Public endpoints that callers reach with their own credentials (deployment keys, webhook signatures, share links)
# are rate-limited per client address (S30): 20 requests/s with bursts of 40, then 429.
map $uri $public_api_client {
  ~^/api/v1/((deployments/[^/]+/(runs|threads|mcp|a2a)|hooks|matura/events)(/|$)|share/)  $binary_remote_addr;
  default                                                        "";
}
# The client address: X-Forwarded-For is believed only from TRUSTED_PROXIES (an ingress or load balancer in
# front of this server; 127.0.0.1/32 = nothing in front). Both the rate limit above and the audit log's address
# use the result, and the API is sent only that one address, so a caller cannot forge it.
${TRUSTED_PROXIES_REAL_IP}
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# The scheme callers used: a TLS-terminating proxy in TRUSTED_PROXIES says it in X-Forwarded-Proto (believed only from
# there, by the address that connected, before X-Forwarded-For rewrote it); otherwise this server's own. The API
# names its public addresses with it (an A2A agent card's url, SCIM's Location), so https stays https.
geo $realip_remote_addr $from_trusted_proxy {
  default 0;
  ${TRUSTED_PROXIES_GEO}
}
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
  ~^1:(?<proto>https?)$  $proto;
  default                $scheme;
}
# Which share link a page request is for, as the API path that answers who may frame it. `auth_request` takes a fixed
# URI (it does not expand variables, so `/_share_frame/$share_token` was asked for literally and never reached the API),
# so the token travels in the original request URI, which a subrequest still sees as $request_uri.
map $request_uri $share_frame_path {
  ~^/s/([A-Za-z0-9_-]+)/?(?:\?.*)?$  /v1/share/$1/frame;
  default                            /v1/share/invalid/frame;
}
limit_req_zone $public_api_client zone=public_api:10m rate=20r/s;
limit_req_status 429;

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # operational endpoints stay inside the cluster: scrape /metrics from the API pods directly
  location = /api/metrics {
    return 404;
  }

  location /api/ {
    limit_req zone=public_api burst=40 nodelay;
    add_header X-Content-Type-Options nosniff always;
    proxy_pass ${API_UPSTREAM}/;              # strips the /api prefix
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # the real client (see set_real_ip_from)
    proxy_set_header X-Forwarded-Proto $forwarded_proto;  # https behind a TLS-terminating proxy (see the map)
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Prefix /api;         # public addresses the API names (agent cards, SCIM Location)
    # Server-Sent Events (run streams, event feeds): never buffer, allow long-lived responses
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # (add_header in a location replaces the server's, so each location lists the security headers)
  # hashed build assets never change: cache them for a year
  location /assets/ {
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # share links (S23): the public chat page, which any site may show in an iframe (the chat widget). Served here,
  # not through `location /`, so it gets frame-ancestors * and no X-Frame-Options; every other page keeps 'self'.
  # Which sites may frame it is per link: nginx asks the API (the link's allowed sites, `*` when the builder listed none)
  # and puts the answer in the page's frame-ancestors. An API that is down answers 5xx: the page is not served.
  location ~ ^/s/[A-Za-z0-9_-]+/?$ {
    auth_request /_share_frame;
    auth_request_set $frame_ancestors $upstream_http_x_frame_ancestors;
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY_EMBED}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;               # served in this location (no internal redirect to `location /`)
  }

  location = /_share_frame {
    internal;
    rewrite ^ $share_frame_path break;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }

  # anything else under /s/ (no token) is the app shell, framable by the app only
  location /s/ {
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # the chat widget's loader: any site adds it with a <script> tag
  location = /widget.js {
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
    default_type application/javascript;
    try_files $uri =404;
  }

  # everything else is the app shell: always revalidate so a new release is picked up
  location / {
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;               # client-side routing
  }
}
