# The web image's nginx site (a template: ${API_UPSTREAM} is filled in at start-up).
# Serves the SPA and proxies /api/ to the API, unbuffered so Server-Sent Events stream in real time.
# Public endpoints that callers reach with their own credentials (deployment keys, webhook signatures) are
# rate-limited per client address (S30): 20 requests/s with bursts of 40, then 429.
map $uri $public_api_client {
  ~^/api/v1/(deployments/[^/]+/(runs|threads)|hooks)/  $binary_remote_addr;
  default                                              "";
}
limit_req_zone $public_api_client zone=public_api:10m rate=20r/s;
limit_req_status 429;

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # operational endpoints stay inside the cluster: scrape /metrics from the API pods directly
  location = /api/metrics {
    return 404;
  }

  location /api/ {
    limit_req zone=public_api burst=40 nodelay;
    add_header X-Content-Type-Options nosniff always;
    proxy_pass ${API_UPSTREAM}/;              # strips the /api prefix
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-Sent Events (run streams, event feeds): never buffer, allow long-lived responses
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # (add_header in a location replaces the server's, so each location lists the security headers)
  # hashed build assets never change: cache them for a year
  location /assets/ {
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # everything else is the app shell: always revalidate so a new release is picked up
  location / {
    add_header Content-Security-Policy "${CONTENT_SECURITY_POLICY}" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;               # client-side routing
  }
}
