# The web image's nginx site (a template: ${API_UPSTREAM} is filled in at start-up).
# Serves the SPA and proxies /api/ to the API, unbuffered so Server-Sent Events stream in real time.
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass ${API_UPSTREAM}/;              # strips the /api prefix
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-Sent Events (run streams, event feeds): never buffer, allow long-lived responses
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # (add_header in a location replaces the server's, so each location lists the security headers)
  # hashed build assets never change: cache them for a year
  location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # everything else is the app shell: always revalidate so a new release is picked up
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;               # client-side routing
  }
}
