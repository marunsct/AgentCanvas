# Local infrastructure for AgentCanvas development (`make infra`). Development passwords: every port is published on
# 127.0.0.1 only, so nothing here is reachable from the network.
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml --profile auth up -d   # also start Keycloak (M7)
# The API needs no Redis (runs, checkpoints and memory live in Postgres), so there is none here.
services:
  postgres:
    image: pgvector/pgvector:pg16          # Postgres 16 + pgvector (needed for semantic memory search)
    environment:
      POSTGRES_USER: agentcanvas
      POSTGRES_PASSWORD: agentcanvas        # dev only
      POSTGRES_DB: agentcanvas
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcanvas"]
      interval: 5s
      retries: 10

  keycloak:                                  # OIDC login for M7 (optional before that)
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin     # dev only
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
