{{- $name := include "agentcanvas.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "agentcanvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "agentcanvas.selector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        {{- include "agentcanvas.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- $scrape := and .Values.observability.metrics.enabled .Values.observability.metrics.podAnnotations }}
      {{- if or .Values.api.podAnnotations $scrape }}
      annotations:
        {{- if $scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "agentcanvas.podSecurity" . | nindent 8 }}
        fsGroup: 10001
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "agentcanvas.spread" (dict "root" . "component" "api") | nindent 6 }}
      containers:
        - name: api
          image: {{ include "agentcanvas.image" (dict "root" . "component" "api") }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            {{- include "agentcanvas.apiEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "agentcanvas.secret" . }}
          volumeMounts:
            - { name: workspaces, mountPath: /data/workspaces }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }   # database and run store answer
            periodSeconds: 10
            timeoutSeconds: 5
          lifecycle:
            preStop:   # let the Service drop this pod before uvicorn stops accepting connections
              exec: { command: ["sleep", "5"] }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "agentcanvas.containerSecurity" . | nindent 12 }}
      volumes:
        - name: workspaces
          {{- if .Values.workspaces.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.workspaces.persistence.existingClaim | default (printf "%s-workspaces" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-api
  labels:
    {{- include "agentcanvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "agentcanvas.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.api.port }}, targetPort: http }
{{- if and .Values.workspaces.persistence.enabled (not .Values.workspaces.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-workspaces
  labels:
    {{- include "agentcanvas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # workspaces outlive an uninstall
spec:
  accessModes: {{ toYaml .Values.workspaces.persistence.accessModes | nindent 4 }}
  {{- with .Values.workspaces.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspaces.persistence.size }}
{{- end }}
