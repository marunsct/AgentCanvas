{{- if (.Values.api.serviceAccount | default dict).create }}
# the API's identity in the cloud (AWS IRSA or GKE Workload Identity, through its annotations): no Kubernetes API access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentcanvas.apiServiceAccount" . }}
  labels:
    {{- include "agentcanvas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
