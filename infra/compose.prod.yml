# Production-style single host (M8-T2): Postgres, a one-shot migration, two API replicas behind nginx.
#   docker build -f infra/Dockerfile.api -t agentcanvas-api apps/api
#   docker build -f infra/Dockerfile.web -t agentcanvas-web .
#   cp infra/.env.prod.example infra/.env.prod   # then fill it in
#   docker compose -f infra/compose.prod.yml --env-file infra/.env.prod up -d
# Put a TLS-terminating proxy in front of `web` and keep response buffering off for /api/ (Server-Sent Events).
name: agentcanvas

x-api: &api
  image: ${API_IMAGE:-agentcanvas-api:latest}
  # every setting in infra/.env.prod reaches the API (retention, model prices, provider keys, AGENTCANVAS_PUBLIC_URL,
  # OTEL_*, LANGSMITH_*, AGENTCANVAS_MATURA_*...); the `environment` below wins where both name one. The file's name
  # is fixed here: --env-file only fills in the ${...} of this file.
  env_file:
    - path: .env.prod
      required: false                          # CI and others pass everything as environment variables instead
  environment: &api-env
    POSTGRES_PASSWORD: ""                      # the owner's password stays with the migrate service's URL
    # the API connects as an ordinary role, so row-level security applies (the owner only runs migrations)
    DATABASE_URL: postgresql://agentcanvas_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/agentcanvas
    AGENTCANVAS_ENV: ${AGENTCANVAS_ENV:-prod}
    AGENTCANVAS_EDITION: ${AGENTCANVAS_EDITION:-dev}
    AGENTCANVAS_SECRET_KEY: ${AGENTCANVAS_SECRET_KEY:?set AGENTCANVAS_SECRET_KEY (64+ random characters)}
    LANGGRAPH_AES_KEY: ${LANGGRAPH_AES_KEY:?set LANGGRAPH_AES_KEY (16, 24 or 32 characters) - checkpoints are encrypted at rest}
    AGENTCANVAS_KMS_KEY: ${AGENTCANVAS_KMS_KEY:-}
    AGENTCANVAS_AUTO_MIGRATE: "false"          # the migrate service runs them once, before any replica starts
    AGENTCANVAS_SEED_DEV_DATA: ${AGENTCANVAS_SEED_DEV_DATA:-true}  # creates the default organisation and project
    AGENTCANVAS_AUTH_MODE: ${AGENTCANVAS_AUTH_MODE:-oidc}
    AGENTCANVAS_OIDC_ISSUER: ${AGENTCANVAS_OIDC_ISSUER:-}
    AGENTCANVAS_OIDC_AUDIENCE: ${AGENTCANVAS_OIDC_AUDIENCE:-}
    AGENTCANVAS_OIDC_CLIENT_ID: ${AGENTCANVAS_OIDC_CLIENT_ID:-}
    AGENTCANVAS_BOOTSTRAP_ADMIN_EMAILS: ${AGENTCANVAS_BOOTSTRAP_ADMIN_EMAILS:-[]}
    AGENTCANVAS_CORS_ORIGINS: ${AGENTCANVAS_CORS_ORIGINS:-[]}
    # workspace code runs in the `sandbox` service below: a container with no database credentials, no keys, no
    # route out and only the files of the call. (`subprocess` is limits only, not isolation: same user and files.)
    AGENTCANVAS_SCRIPT_EXECUTION: ${AGENTCANVAS_SCRIPT_EXECUTION:-remote}
    AGENTCANVAS_SANDBOX_URL: ${AGENTCANVAS_SANDBOX_URL:-http://sandbox:8090}
    AGENTCANVAS_SANDBOX_TOKEN: ${AGENTCANVAS_SANDBOX_TOKEN:?set AGENTCANVAS_SANDBOX_TOKEN (32+ random characters)}
    # hosts a project's sandbox.json allows are reached through the `egress` service below, and only those
    AGENTCANVAS_EGRESS_PROXY: egress:3128
    AGENTCANVAS_EGRESS_SECRET: ${AGENTCANVAS_EGRESS_SECRET:?set AGENTCANVAS_EGRESS_SECRET (32+ random characters)}
    # the network the API shares with the sandbox service: workspace code runs there, so its requests are refused
    AGENTCANVAS_REFUSE_CLIENTS: '["${SANDBOX_CONTROL_SUBNET:-10.250.250.0/24}"]'
    FORWARDED_ALLOW_IPS: ${FRONT_SUBNET:-10.250.251.0/24}  # only nginx (web, on `front`) is trusted for X-Forwarded-*
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  volumes:
    - workspaces:/data/workspaces              # project workspaces (git), shared by the replicas on this host
  # nothing but the workspaces volume, /tmp (exports, uploads, framework workers) and the app user's home (caches some
  # frameworks keep) is writable; API_READ_ONLY=false turns the read-only root off if a framework needs more
  read_only: ${API_READ_ONLY:-true}
  tmpfs:
    - /tmp:size=1g,mode=1777
    - /home/app:size=256m,uid=10001,gid=10001,mode=0700
  cap_drop: [ALL]                              # it runs as uid 10001 and needs no capability
  security_opt: ["no-new-privileges:true"]
  mem_limit: ${API_MEM_LIMIT:-2g}
  pids_limit: 1024

services:
  # Runs workspace code for the API (script_execution=remote). Same image, none of the API's secrets, read-only root,
  # no capabilities, and two internal networks: `sandbox`, whose only way out is the egress proxy (for the hosts a
  # project's sandbox.json lists), and `sandbox-control`, where the API calls it and refuses any request from it.
  sandbox:
    image: ${API_IMAGE:-agentcanvas-api:latest}
    command: ["uvicorn", "agentcanvas.sandbox.service:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      AGENTCANVAS_SANDBOX_TOKEN: ${AGENTCANVAS_SANDBOX_TOKEN:?set AGENTCANVAS_SANDBOX_TOKEN (32+ random characters)}
      # one call at a time per container, and after each nothing it started or wrote is left (S-2); more
      # calls at once come from more replicas
      AGENTCANVAS_SANDBOX_SWEEP: "1"
    networks: [sandbox, sandbox-control]       # the API calls it on sandbox-control, and refuses calls back
    deploy:
      replicas: ${SANDBOX_REPLICAS:-4}
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The sandbox network's only way out (sandbox.json egress): admits the hosts each call's project lists, signed by the
  # API, and refuses private addresses (the database, the API) and link-local ones (cloud metadata), even when a
  # project lists them. AGENTCANVAS_EGRESS_ALLOW_PRIVATE=1 opens private addresses (never link-local) to every project.
  egress:
    image: ${API_IMAGE:-agentcanvas-api:latest}
    command: ["python", "-m", "agentcanvas.sandbox.egress", "--port", "3128"]
    # only its own settings, not infra/.env.prod: the proxy faces the internet and needs none of the API's keys
    environment:
      AGENTCANVAS_EGRESS_SECRET: ${AGENTCANVAS_EGRESS_SECRET:?set AGENTCANVAS_EGRESS_SECRET (32+ random characters)}
      AGENTCANVAS_EGRESS_ALLOW_PRIVATE: ${AGENTCANVAS_EGRESS_ALLOW_PRIVATE:-0}
    networks: [default, sandbox]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3128), 2)"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    # pinned by digest (Dependabot proposes new ones); a new major version needs a dump and restore (deploy.md)
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f}
    # each API replica opens up to AGENTCANVAS_DB_POOL_SIZE + AGENTCANVAS_DB_MAX_OVERFLOW + AGENTCANVAS_PERSISTENCE_POOL_SIZE
    # (10 + 20 + 20 = 50) connections: API_REPLICAS x 50 + 10 (migrations, psql, backups) must stay below this.
    # 200 fits three replicas; raise it (or lower the pools) for more (docs/user-guide/deploy.md)
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: agentcanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agentcanvas
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcanvas"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://agentcanvas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/agentcanvas
      APP_DB_USER: agentcanvas_app
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    # migrations as the owner, then the API's own role: no superuser, no BYPASSRLS
    command: ["sh", "-c", "alembic upgrade head && python -m agentcanvas.db.app_role"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api
    deploy:
      replicas: ${API_REPLICAS:-2}
    networks: [default, front, sandbox-control]
    depends_on:
      migrate: { condition: service_completed_successfully }
      sandbox: { condition: service_healthy }
    stop_grace_period: 60s                     # streams get 30 s to finish, then runs 20 s before hand-over
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-agentcanvas-web:latest}
    environment:
      API_UPSTREAM: http://api:8000            # compose balances across the api replicas
      OIDC_ISSUER: ${AGENTCANVAS_OIDC_ISSUER:-} # its origin is allowed in the Content-Security-Policy
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}     # other identity provider origins (e.g. a separate token host)
    # plain HTTP: only this host reaches it, for the TLS-terminating proxy in front; WEB_BIND=0.0.0.0 opens it to the
    # network (when that proxy runs on another machine)
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"]
    networks: [front]                          # it reaches the API and nothing else
    depends_on:
      api: { condition: service_healthy }
    healthcheck:                               # `up --wait` returns only once nginx answers
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      start_interval: 1s
      start_period: 30s
      retries: 10
    restart: unless-stopped

networks:
  sandbox:
    internal: true                             # no route out but the egress proxy: never the database, only listed hosts
  # the API calls the sandbox service here; a request the other way (workspace code calling the API) is refused
  sandbox-control:
    internal: true
    ipam: { config: [{ subnet: "${SANDBOX_CONTROL_SUBNET:-10.250.250.0/24}" }] }
  # nginx to the API: the only network whose X-Forwarded-For the API believes
  front:
    ipam: { config: [{ subnet: "${FRONT_SUBNET:-10.250.251.0/24}" }] }

volumes:
  pgdata:
  workspaces:
